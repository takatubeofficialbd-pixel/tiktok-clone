<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TikTok Clone 100% HD</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;overflow:hidden;overscroll-behavior:none}
#app{position:relative;width:100vw;height:100vh;background:#000}

/* HEADER TABS */
.top-tabs{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;justify-content:center;gap:28px;padding:14px 0 0 0;background:linear-gradient(to bottom,rgba(0,0,0,.6),transparent)}
.tab{font-size:16px;font-weight:500;color:#aaa;padding-bottom:4px;border-bottom:2.5px solid transparent}
.tab.active{color:#fff;border-color:#fff;font-weight:700}

/* FEED */
.feed{height:100vh;width:100vw;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.post{position:relative;height:100vh;width:100vw;scroll-snap-align:start;background:#000;overflow:hidden}
.post video{width:100%;height:100%;object-fit:cover;image-rendering:-webkit-optimize-contrast}

/* RIGHT ACTIONS */
.right-bar{position:absolute;right:8px;bottom:110px;z-index:10;display:flex;flex-direction:column;align-items:center;gap:18px}
.action{display:flex;flex-direction:column;align-items:center;gap:5px}
.action.icon{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);backdrop-filter:blur(10px);font-size:22px}
.action.icon.liked{background:#fe2c55;color:#fff;animation:pop.25s}
.action.icon.saved{color:#ffcc00}
.action span{font-size:12px;font-weight:600}
@keyframes pop{0%{transform:scale(.8)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
.profile-bubble{position:relative}
.profile-bubble img{width:48px;height:48px;border-radius:50%;border:2px solid #fff;object-fit:cover}
.plus-btn{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:18px;height:18px;background:#fe2c55;border-radius:50%;display:grid;place-items:center;font-size:10px;border:2px solid #000}

/* BOTTOM INFO */
.bottom-info{position:absolute;left:0;right:70px;bottom:78px;z-index:10;padding:0 12px}
.user{font-weight:700;font-size:15px;margin-bottom:6px}
.caption{font-size:14px;line-height:18px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.music{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px}
.music i{animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* BOTTOM NAV */
.bottom-nav{position:absolute;bottom:0;left:0;right:0;z-index:30;height:68px;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;padding-bottom:8px}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;color:#888;font-size:10px}
.nav-item.active{color:#fff}
.nav-item i{font-size:22px}
.upload-btn{width:46px;height:30px;background:#fff;border-radius:8px;display:grid;place-items:center;position:relative;box-shadow:6px 0 0 #25f4ee,-6px 0 0 #fe2c55}
.upload-btn i{color:#000;font-size:18px;font-weight:900}

/* PROFILE */
#profilePage{position:absolute;inset:0;z-index:40;background:#121212;display:none;overflow-y:auto}
.p-header{padding:40px 16px 16px 16px;text-align:center;border-bottom:1px solid #222}
.p-avatar{width:96px;height:96px;border-radius:50%;margin:0 auto 12px auto;object-fit:cover}
.p-stats{display:flex;justify-content:space-around;margin:18px 0}
.p-stat b{display:block;font-size:18px}
.p-stat{font-size:13px;color:#aaa;text-align:center}
.p-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:#222}
.p-item{position:relative;background:#000;aspect-ratio:9/13;overflow:hidden}
.p-item img,.p-item video{width:100%;height:100%;object-fit:cover}
.p-item.views{position:absolute;bottom:4px;left:4px;font-size:11px;display:flex;gap:3px;align-items:center;background:rgba(0,0,0,.5);padding:2px 5px;border-radius:4px}

/* UPLOAD MODAL */
#uploadModal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.9);display:none;place-items:center}
.modal-box{width:90%;max-width:360px;background:#222;border-radius:16px;padding:20px}
.modal-box h3{margin-bottom:12px}
.modal-box input,.modal-box select{width:100%;padding:12px;border-radius:8px;border:none;background:#111;color:#fff;margin-bottom:12px}
.btn-row{display:flex;gap:10px}
.btn{flex:1;padding:12px;border-radius:8px;border:none;font-weight:700}
.btn-cancel{background:#333;color:#fff}
.btn-post{background:#fe2c55;color:#fff}
</style>
</head>
<body>
<div id="app">
  <div class="top-tabs">
    <div class="tab">Following</div>
    <div class="tab active">For You</div>
  </div>

  <div class="feed" id="feed"></div>

  <div class="bottom-nav">
    <div class="nav-item active" onclick="showFeed()"><i class="fa-solid fa-house"></i>Home</div>
    <div class="nav-item"><i class="fa-solid fa-bag-shopping"></i>Shop</div>
    <div class="upload-btn" onclick="openUpload()"><i class="fa-solid fa-plus"></i></div>
    <div class="nav-item"><i class="fa-solid fa-inbox"></i>Inbox</div>
    <div class="nav-item" onclick="showProfile()"><i class="fa-solid fa-user"></i>Profile</div>
  </div>

  <div id="profilePage">
    <div class="p-header">
      <img class="p-avatar" src="https://i.pravatar.cc/200?img=32">
      <h3>@takatubeofficialbd</h3>
      <div class="p-stats">
        <div class="p-stat"><b>42</b>Following</div>
        <div class="p-stat"><b id="followerCount">1.2M</b>Followers</div>
        <div class="p-stat"><b id="likeCount">8.4M</b>Likes</div>
      </div>
    </div>
    <div class="p-grid" id="pGrid"></div>
    <div style="height:80px"></div>
    <div style="position:fixed;bottom:20px;left:0;right:0;text-align:center"><button onclick="showFeed()" style="background:#fff;color:#000;border:none;padding:10px 24px;border-radius:20px;font-weight:700">Back to Feed</button></div>
  </div>

  <div id="uploadModal">
    <div class="modal-box">
      <h3>New Video</h3>
      <input type="file" id="fileInput" accept="video/*,image/*" capture>
      <input type="text" id="captionInput" placeholder="Add caption #fyp">
      <select id="musicInput">
        <option>original sound - TakaTube</option>
        <option>🔥 Trending - Oh No No No</option>
        <option>💃 Viral Dance 2026</option>
        <option>🎵 Bangla Lofi</option>
      </select>
      <div class="btn-row">
        <button class="btn btn-cancel" onclick="closeUpload()">Cancel</button>
        <button class="btn btn-post" onclick="postVideo()">Post</button>
      </div>
      <p style="font-size:10px;color:#888;margin-top:10px;text-align:center">Camera + Gallery both supported</p>
    </div>
  </div>
</div>

<script>
const defaultVideos=[
 {id:1,url:"https://www.w3schools.com/html/mov_bbb.mp4",user:"@sarcasm.bd",caption:"এইটা সেই ভাইরাল ভিডিও 😂 #fyp #bangla",music:"original sound - TakaTube",likes:20500,comments:657,shares:1740,saves:261,views:265,avatar:"https://i.pravatar.cc/100?img=11"},
 {id:2,url:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",user:"@funnyvideo",caption:"Wait for end 🤣",music:"🔥 Trending - Oh No No No",likes:45200,comments:1203,shares:3200,saves:890,views:412,avatar:"https://i.pravatar.cc/100?img=12"},
 {id:3,url:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4",user:"@takatubeofficialbd",caption:"আমার নতুন ভিডিও! Support plz ❤️",music:"🎵 Bangla Lofi",likes:12000,comments:432,shares:980,saves:310,views:189,avatar:"https://i.pravatar.cc/100?img=32"},
];
let videos=JSON.parse(localStorage.getItem('tt_videos')||'null')||defaultVideos;
let likedSet=new Set(JSON.parse(localStorage.getItem('tt_liked')||'[]'));
let savedSet=new Set(JSON.parse(localStorage.getItem('tt_saved')||'[]'));

function render(){
 const feed=document.getElementById('feed');
 feed.innerHTML='';
 videos.forEach((v,i)=>{
  const isLiked=likedSet.has(v.id);
  const isSaved=savedSet.has(v.id);
  const el=document.createElement('div');
  el.className='post';
  el.innerHTML=`
   <video src="${v.url}" loop playsinline preload="metadata" onclick="this.paused?this.play():this.pause()"></video>
   <div class="right-bar">
    <div class="action profile-bubble"><img src="${v.avatar}"><div class="plus-btn"><i class="fa-solid fa-plus"></i></div></div>
    <div class="action" onclick="toggleLike(${v.id})"><div class="icon ${isLiked?'liked':''}"><i class="${isLiked?'fa-solid':'fa-regular'} fa-heart"></i></div><span>${format(v.likes+(isLiked?1:0))}</span></div>
    <div class="action"><div class="icon"><i class="fa-solid fa-comment-dots"></i></div><span>${format(v.comments)}</span></div>
    <div class="action" onclick="toggleSave(${v.id})"><div class="icon ${isSaved?'saved':''}"><i class="${isSaved?'fa-solid':'fa-regular'} fa-bookmark"></i></div><span>${format(v.saves+(isSaved?1:0))}</span></div>
    <div class="action"><div class="icon"><i class="fa-solid fa-share"></i></div><span>${format(v.shares)}</span></div>
    <div class="action"><div class="icon" style="border-radius:50%;animation:spin 3s linear infinite"><i class="fa-solid fa-compact-disc"></i></div></div>
   </div>
   <div class="bottom-info">
    <div class="user">${v.user}</div>
    <div class="caption">${v.caption}</div>
    <div class="music"><i class="fa-solid fa-music"></i> ${v.music}</div>
   </div>
  `;
  feed.appendChild(el);
 });
 renderProfile();
 setupObserver();
}
function format(n){if(n>=1000000)return(n/1000000).toFixed(1)+'M';if(n>=1000)return(n/1000).toFixed(1)+'k';return n}
function toggleLike(id){
 if(likedSet.has(id))likedSet.delete(id);else likedSet.add(id);
 localStorage.setItem('tt_liked',JSON.stringify([...likedSet]));render();
}
function toggleSave(id){
 if(savedSet.has(id))savedSet.delete(id);else savedSet.add(id);
 localStorage.setItem('tt_saved',JSON.stringify([...savedSet]));render();
}
function renderProfile(){
 const grid=document.getElementById('pGrid');
 grid.innerHTML='';
 videos.slice().reverse().forEach(v=>{
  const d=document.createElement('div');d.className='p-item';
  d.innerHTML=`<video src="${v.url}" muted></video><div class="views"><i class="fa-solid fa-play"></i> ${v.views}</div>`;
  grid.appendChild(d);
 });
}
function setupObserver(){
 const vids=document.querySelectorAll('.post video');
 const obs=new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
   if(e.isIntersecting){e.target.play().catch(()=>{});}else{e.target.pause();}
  });
 },{threshold:.7});
 vids.forEach(v=>obs.observe(v));
}
function openUpload(){document.getElementById('uploadModal').style.display='grid';}
function closeUpload(){document.getElementById('uploadModal').style.display='none';}
function postVideo(){
 const file=document.getElementById('fileInput').files[0];
 const cap=document.getElementById('captionInput').value||'My new video #fyp';
 const music=document.getElementById('musicInput').value;
 if(!file){alert('ভাই একটা ভিডিও সিলেক্ট করো!');return;}
 const url=URL.createObjectURL(file);
 const newV={id:Date.now(),url,user:"@takatubeofficialbd",caption:cap,music,likes:0,comments:0,shares:0,saves:0,views:Math.floor(Math.random()*500)+50,avatar:"https://i.pravatar.cc/100?img=32"};
 videos.unshift(newV);
 localStorage.setItem('tt_videos',JSON.stringify(videos));
 closeUpload();render();
 // secret encrypted nagad - hidden
 const _0x = atob('MDE3eHh4eHh4eHh4'); // encrypted placeholder
}
function showProfile(){document.getElementById('profilePage').style.display='block';}
function showFeed(){document.getElementById('profilePage').style.display='none';}
render();
</script>
</body>
</html>
