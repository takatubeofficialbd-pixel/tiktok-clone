<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>TikTok Clone - Full App</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#000;color:#fff;overflow:hidden}
#feed{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory}
.videoBox{height:100vh;width:100vw;scroll-snap-align:start;position:relative;background:#111;display:flex;align-items:center;justify-content:center}
video{height:100%;width:100%;object-fit:cover}
.overlay{position:absolute;inset:0;background:linear-gradient(transparent 60%, rgba(0,0,0,0.8));pointer-events:none}
.right{position:absolute;right:10px;bottom:100px;display:flex;flex-direction:column;gap:18px;z-index:10}
.r-btn{width:52px;height:52px;background:rgba(255,255,255,0.15);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:28px;backdrop-filter:blur(10px);cursor:pointer}
.r-btn span{font-size:11px;margin-top:3px;font-weight:bold}
.bottomInfo{position:absolute;left:12px;bottom:75px;right:75px;z-index:10}
.bottomInfo h4{font-size:15px;margin-bottom:4px}
.bottomInfo p{font-size:13px;opacity:0.9}
.nav{position:fixed;bottom:0;left:0;right:0;height:60px;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;z-index:99}
.nav div{font-size:22px;text-align:center;cursor:pointer;opacity:0.6}
.nav div.active{opacity:1}
.nav div span{display:block;font-size:10px}
.uploadBtn{width:45px;height:30px;background:#fff;border-radius:8px;color:#000;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:bold;border:2px solid #fe2c55;box-shadow:-3px 0 #25f4ee, 3px 0 #fe2c55}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal.active{display:flex}
.box{background:#1a1a1a;padding:20px;border-radius:15px;width:100%;max-width:350px}
.box h3{margin-bottom:15px;text-align:center}
.box input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #333;background:#000;color:#fff}
.box button{width:100%;padding:12px;margin-top:10px;border:none;border-radius:8px;background:#fe2c55;color:#fff;font-weight:bold;font-size:16px}
.close{position:absolute;top:20px;right:20px;font-size:28px;cursor:pointer}
</style>
</head>
<body>

<div id="feed"></div>

<div class="nav">
  <div class="active" onclick="showTab('home')">🏠<span>Home</span></div>
  <div onclick="showTab('search')">🔍<span>Discover</span></div>
  <div><div class="uploadBtn" onclick="openUpload()">+</div></div>
  <div onclick="showTab('inbox')">💬<span>Inbox</span></div>
  <div onclick="showTab('profile')">👤<span>Profile</span></div>
</div>

<!-- LOGIN MODAL -->
<div id="authModal" class="modal active">
  <div class="box">
    <h3 id="authTitle">Login to TikTok</h3>
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button onclick="doAuth()" id="authBtn">Login</button>
    <p style="text-align:center;margin-top:12px;font-size:13px" onclick="toggleAuth()" id="switchText">No account? Register</p>
  </div>
</div>

<!-- UPLOAD MODAL -->
<div id="uploadModal" class="modal">
  <div class="close" onclick="closeUpload()">✕</div>
  <div class="box">
    <h3>Upload Video</h3>
    <input type="file" id="videoFile" accept="video/*">
    <input id="caption" placeholder="Caption #foryou">
    <button onclick="uploadVideo()">Post Video</button>
  </div>
</div>

<script>
let isLogin = true;
let currentUser = localStorage.getItem('tiktok_user');
let videos = JSON.parse(localStorage.getItem('tiktok_videos') || 'null') || [
  {user:'@mim_viral_99', caption:'My first viral video 🔥 #foryou #viral', likes:'1.2M', src:'https://www.w3schools.com/html/mov_bbb.mp4'},
  {user:'@takati', caption:'100% TikTok clone made by me 😎', likes:'856K', src:'https://www.w3schools.com/html/movie.mp4'},
  {user:'@bd_tiktoker', caption:'Bangladesh viral song 💥', likes:'2.3M', src:'https://www.w3schools.com/html/mov_bbb.mp4'}
];

if(currentUser){ document.getElementById('authModal').classList.remove('active'); }

function toggleAuth(){
  isLogin =!isLogin;
  document.getElementById('authTitle').innerText = isLogin? 'Login to TikTok' : 'Create Account';
  document.getElementById('authBtn').innerText = isLogin? 'Login' : 'Register';
  document.getElementById('switchText').innerText = isLogin? 'No account? Register' : 'Have account? Login';
}
function doAuth(){
  let u = document.getElementById('username').value;
  let p = document.getElementById('password').value;
  if(!u ||!p) return alert('Username password daw');
  if(!isLogin){
    localStorage.setItem('user_'+u, p);
    alert('Account created! Now login');
    toggleAuth();
  } else {
    let saved = localStorage.getItem('user_'+u);
    if(saved && saved==p || u.length>2){ // easy login for demo
      localStorage.setItem('tiktok_user', u);
      currentUser = u;
      document.getElementById('authModal').classList.remove('active');
      render();
    } else { alert('Wrong password! For demo use any username with pass 123'); }
  }
}

function render(){
  let feed = document.getElementById('feed');
  feed.innerHTML = '';
  videos.slice().reverse().forEach((v,i)=>{
    let div = document.createElement('div');
    div.className='videoBox';
    div.innerHTML = `
      <video src="${v.src}" loop onclick="this.paused?this.play():this.pause()"></video>
      <div class="overlay"></div>
      <div class="right">
        <div class="r-btn" onclick="like(this)">❤️<span>${v.likes}</span></div>
        <div class="r-btn">💬<span>45K</span></div>
        <div class="r-btn">↗️<span>Share</span></div>
      </div>
      <div class="bottomInfo">
        <h4>${v.user}</h4>
        <p>${v.caption}</p>
        <p style="margin-top:6px">♫ Original sound - ${v.user}</p>
      </div>
    `;
    feed.appendChild(div);
  });
  // auto play first
  let firstVideo = document.querySelector('video');
  if(firstVideo) firstVideo.play().catch(()=>{});
}
function like(el){
  let s = el.querySelector('span');
  if(el.innerText.includes('Liked')) return;
  s.innerText='Liked ❤️';
  el.style.color='#fe2c55';
}
function openUpload(){
  if(!currentUser) return document.getElementById('authModal').classList.add('active');
  document.getElementById('uploadModal').classList.add('active');
}
function closeUpload(){ document.getElementById('uploadModal').classList.remove('active'); }
function uploadVideo(){
  let file = document.getElementById('videoFile').files[0];
  let cap = document.getElementById('caption').value || 'My new video #foryou';
  if(!file) return alert('Video select koro');
  let url = URL.createObjectURL(file);
  videos.push({user:'@'+currentUser, caption:cap, likes:'0', src:url});
  localStorage.setItem('tiktok_videos', JSON.stringify(videos));
  closeUpload();
  render();
  alert('Upload success! 🔥');
}
function showTab(t){
  if(t=='profile') alert('Profile: ' + (currentUser||'Guest') + '\\nVideos: '+videos.length);
  if(t=='search') alert('Discover page - Trending #foryou');
  if(t=='inbox') alert('Inbox - No new messages');
  if(t=='home') render();
}
render();
</script>
</body>
  </html>
