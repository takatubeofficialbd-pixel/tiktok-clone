<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akash Market - 100%</title>
<script src="https://s3.tradingview.com/tv.js"></script>
<style>
body{background:#0f0f0f;color:#fff;font-family:Arial;margin:0}
.header{display:flex;justify-content:space-between;padding:12px;background:#1a1a1a;border-bottom:1px solid #333}
.balance{color:#00ff88;font-weight:bold;font-size:18px}
.container{display:flex;height:90vh}
.chart-box{flex:3;background:#000}
.trade-box{flex:1;background:#1a1a1a;padding:15px;border-left:1px solid #333}
.btn{width:100%;padding:15px;margin:8px 0;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer}
.btn-up{background:#00c853;color:#fff}
.btn-down{background:#ff1744;color:#fff}
.input{width:100%;padding:10px;margin:6px 0;background:#2a2a2a;border:1px solid #444;color:#fff;border-radius:5px}
.num-box{background:#2a2a2a;padding:10px;border-radius:8px;margin:10px 0;border:1px dashed #00ff88}
</style>
</head>
<body>
<div class="header">
<div>🔥 AKASH EYE MARKET</div>
<div class="balance">Balance: ৳ <span id="bal">500.00</span></div>
</div>

<div class="container">
<div class="chart-box" id="tv_chart"></div>

<div class="trade-box">
<h3>Trade</h3>
<input id="amount" class="input" type="number" value="200" min="200" placeholder="Amount Min 200">
<p>Profit: 90%</p>
<button class="btn btn-up" onclick="trade('UP')">⬆ UP</button>
<button class="btn btn-down" onclick="trade('DOWN')">⬇ DOWN</button>
<div id="timer" style="text-align:center;margin-top:15px;font-size:20px;color:yellow"></div>
<hr style="margin:15px 0">

<h3>Deposit (bKash/Nagad)</h3>
<div class="num-box">
bKash: 01713XXXXXXX<br>
Nagad: 01945XXXXXXX<br>
<small>Min: 200 TK</small>
</div>
<select id="method" class="input"><option>bKash</option><option>Nagad</option></select>
<input id="depAmount" class="input" type="number" placeholder="কত টাকা পাঠাইছেন?">
<input id="trxid" class="input" placeholder="TrxID দিন">
<button class="btn" style="background:#00ff88;color:#000" onclick="submitDep()">Deposit Submit</button>
<p id="depMsg" style="color:#00ff88"></p>

<h4 style="margin-top:20px">History</h4>
<div id="history" style="font-size:12px"></div>
</div>
</div>

<script>
// 1. TradingView Live Chart - BTC
new TradingView.widget({
"autosize": true,
"symbol": "BINANCE:BTCUSDT",
"interval": "1",
"timezone": "Asia/Dhaka",
"theme": "dark",
"style": "1",
"locale": "en",
"container_id": "tv_chart"
});

// 2. Trading Logic
let balance = 500;
let currentPrice = 0;
let ws = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@trade');
ws.onmessage = (e)=>{ let data=JSON.parse(e.data); currentPrice=parseFloat(data.p); }

function trade(dir){
 let amt = parseFloat(document.getElementById('amount').value);
 if(amt < 200){ alert('সর্বনিম্ন ট্রেড 200 টাকা মামা!'); return; }
 if(amt > balance){ alert('ব্যালেন্স কম!'); return; }
 
 let entryPrice = currentPrice;
 balance -= amt;
 updateBal();
 
 let timeLeft = 60;
 let interval = setInterval(()=>{
   document.getElementById('timer').innerText = dir + ' ' + timeLeft + 's | Entry: ' + entryPrice.toFixed(2);
   timeLeft--;
   if(timeLeft < 0){
     clearInterval(interval);
     let win = (dir=='UP' && currentPrice > entryPrice) || (dir=='DOWN' && currentPrice < entryPrice);
     if(win){
       let profit = amt * 0.90;
       balance += amt + profit;
       addHistory(`WIN +${profit.toFixed(0)} TK | ${dir}`);
     } else {
       addHistory(`LOSS -${amt} TK | ${dir}`);
     }
     updateBal();
     document.getElementById('timer').innerText = win ? '✅ WIN!' : '❌ LOSS';
   }
 },1000);
}

function updateBal(){ document.getElementById('bal').innerText = balance.toFixed(2); }
function addHistory(t){ document.getElementById('history').innerHTML = `<div>${new Date().toLocaleTimeString()} - ${t}</div>` + document.getElementById('history').innerHTML; }

// 3. Deposit Logic - Manual
let deposits = JSON.parse(localStorage.getItem('deps')||'[]');
function submitDep(){
 let amt = document.getElementById('depAmount').value;
 let trx = document.getElementById('trxid').value;
 let method = document.getElementById('method').value;
 if(amt < 200){ alert('মিনিমাম 200 টাকা'); return; }
 if(!trx){ alert('TrxID দাও'); return; }
 // check duplicate trx
 if(deposits.find(d=>d.trx==trx)){ alert('এই TrxID আগেই ব্যবহার হইছে!'); return; }
 deposits.push({amt, trx, method, status:'pending'});
 localStorage.setItem('deps', JSON.stringify(deposits));
 document.getElementById('depMsg').innerText = 'রিকুয়েস্ট পাঠানো হয়েছে! এডমিন এপ্রুভ করলে ব্যালেন্সে যোগ হবে।';
 // Admin auto approve for demo - তুমি পরে manual করবা
 setTimeout(()=>{
   if(confirm(`ADMIN: ${method} ${amt} TK TrxID ${trx} এপ্রুভ করবো?`)){
     balance += parseFloat(amt);
     updateBal();
     alert('Approved! Balance Added');
   }
 },1000);
}
</script>
</body>
</html>
