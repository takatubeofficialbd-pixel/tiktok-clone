<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TikTok Clone 100% Login</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Hind Siliguri',-apple-system,sans-serif}
body{background:#000;color:#fff;overflow:hidden}
button,input{font-family:inherit}

/* LOGIN / REGISTER */
#authPage{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;justify-content:center;padding:24px}
.auth-logo{font-size:32px;font-weight:900;text-align:center;margin-bottom:6px}
.auth-logo span:first-child{color:#fff}
.auth-logo span:last-child{color:#fe2c55}
.auth-sub{color:#888;text-align:center;font-size:13px;margin-bottom:24px}
.auth-input{width:100%;background:#1c1c1e;border:1px solid #2c2c2e;border-radius:12px;padding:15px;color:#fff;margin-bottom:12px;font-size:14px;outline:none}
.auth-input:focus{border-color:#fe2c55}
.auth-btn{width:100%;padding:15px;border:none;border-radius:12px;background:#fe2c55;color:#fff;font-weight:800;font-size:16px;margin-top:8px}
.auth-switch{margin-top:16px;text-align:center;color:#888;font-size:13px}
.auth-switch b{color:#fff;text-decoration:underline}

/* APP */
#app{display:none;height:100vh}
.top-bar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:center;gap:25px;padding:12px 0;background:linear-gradient(180deg,rgba(0,0,0,.8),transparent)}
.top-bar span{color:#8a8a8a;font-weight:600;font-size:15px;padding-bottom:4px;border-bottom:2px solid transparent}
.top-bar span.active{color:#fff;border-color:#fff}
#feed{height:100vh;width:100vw;overflow-y:scroll;scroll-snap-type:y mandatory}
#feed::-webkit-scrollbar{display:none}
.post{height:100vh;width:100vw;scroll-snap-align:start;position:relative;background:#000}
.post video{width:100%;height:100%;object-fit:cover}
.right{position:absolute;right:10px;bottom:95px;display:flex;flex-direction:column;gap:18px;align-items:center;z-index:10}
.r-icon{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.15);display:grid;place-items:center;font-size:22px}
.r-count{font-size:11px;font-weight:700;margin-top:3px}
.bottom-info{position:absolute;left:12px;right:75px;bottom:85px;z-index:10}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:72px;background:#000;border-top:1px solid #1a1a1a;display:flex;justify-content:space-around;align-items:center;z-index:30;padding-bottom:6px}
.nav{font-size:10px;color:#777;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav.active{color:#fff}
.nav i{font-size:20px}
.plus{width:46px;height:28px;background:#fff;border-radius:8px;display:grid;place-items:center;box-shadow:5px 0 0 #25f4ee, -5px 0 0 #fe2c55}
.plus i{color:#000;font-size:16px}

/* PROFILE EDIT */
#profile{position:fixed;inset:0;background:#000;z-index:40;display:none;overflow-y:auto}
.p-top{padding:40px 16px 16px;text-align:center}
.p-avatar-wrap{position:relative;width:96px;height:96px;margin:0 auto}
.p-avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;border:2px solid #333}
.p-avatar-edit{position:absolute;bottom:0;right:0;width:28px;height:28px;background:#fe2c55;border-radius:50%;display:grid;place-items:center;font-size:12px;border:2px solid #000}
.p-name{margin-top:10px;font-weight:800;font-size:18px;display:flex;justify-content:center;gap:6px;align-items:center}
.p-name i{color:#aaa;font-size:14px}
.p-bio{font-size:12px;color:#aaa;margin-top:4px}
.p-stats{display:flex;justify-content:center;gap:36px;margin:16px 0;font-size:13px;color:#aaa}
.p-stats b{color:#fff;display:block;font-size:16px;text-align:center}
.edit-box{padding:0 16px}
.edit-box input{background:#1c1c1e;border:1px solid #2c2c2e;border-radius:10px;padding:12px;width:100%;color:#fff;margin-bottom:10px}
.p-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:16px}
.p-item{aspect-ratio:3/4;background:#111;position:relative;overflow:hidden}
.p-item video{width:100%;height:100%;object-fit:cover}
.p-view{position:absolute;bottom:4px;left:4px;background:rgba(0,0,0,.6);padding:2px 6px;border-radius:4px;font-size:11px}

/* CAMERA MODAL */
#cameraModal{position:fixed;inset:0;background:#000;z-index:60;display:none;flex-direction:column}
.cam-top{flex:1;position:relative;background:#000}
.cam-top video{width:100%;height:100%;object-fit:cover}
.cam-bottom{height:38%;background:#111;padding:10px}
.cam-actions{display:flex;justify-content:center;gap:30px;align-items:center;margin-top:10px}
.rec-btn{width:70px;height:70px;border-radius:50%;border:4px solid #fe2c55;display:grid;place-items:center}
.rec-btn div{width:52px;height:52px;background:#fe2c55;border-radius:50%}
.gallery-input{margin-top:12px;background:#1c1c1e;border-radius:10px;padding:10px;text-align:center;color:#aaa;font-size:13px}
</style>
</head>
<body>

<!-- AUTH PAGE -->
<div id="authPage">
 <div class="auth-logo"><span>Tik</span><span>Tok</span> BD</div>
 <div class="auth-sub">100% TikTok এর মতো ID খুলুন</div>
 <div id="registerForm">
  <input class="auth-input" id="regName" placeholder="Profile Name (যেমন: TakaTube)" />
  <input class="auth-input" id="regGmail" type="email" placeholder="Gmail (যেমন: your@gmail.com)" />
  <input class="auth-input" id="regMobile" type="tel" placeholder="Mobile Number (01XXXXXXXXX)" />
  <input class="auth-input" id="regPass" type="password" placeholder="Password দিন" />
  <button class="auth-btn" onclick="doRegister()">Registration করুন</button>
  <div class="auth-switch">ID আছে? <b onclick="switchAuth('login')">Login করুন</b></div>
 </div>
 <div id="loginForm" style="display:none">
  <input class="auth-input" id="logGmail" placeholder="Gmail / Mobile" />
  <input class="auth-input" id="logPass" type="password" placeholder="Password" />
  <button class="auth-btn" onclick="doLogin()">Login</button>
  <div class="auth-switch">ID নাই? <b onclick="switchAuth('register')">Registration করুন</b></div>
 </div>
</div>

<!-- APP -->
<div id="app">
 <div class="top-bar"><span>Following</span><span class="active">For You</span></div>
 <div id="feed"></div>
 <div class="bottom-nav">
  <div class="nav active"><i class="fa-solid fa-house"></i>হোম</div>
  <div class="nav"><i class="fa-solid fa-user-group"></i>বন্ধুরা</div>
  <div class="plus" onclick="openCamera()"><i class="fa-solid fa-plus"></i></div>
  <div class="nav"><i class="fa-solid fa-inbox"></i>ইনবক্স</div>
  <div class="nav" onclick="openProfile()"><i class="fa-regular fa-user"></i>প্রোফাইল</div>
 </div>
</div>

<!-- PROFILE PAGE WITH EDIT -->
<div id="profile">
 <div class="p-top">
  <div class="p-avatar-wrap" onclick="document.getElementById('avatarInput').click()">
   <img class="p-avatar" id="profileAvatar" src="https://i.pravatar.cc/200?img=32">
   <div class="p-avatar-edit"><i class="fa-solid fa-camera"></i></div>
  </div>
  <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="changeAvatar(event)">
  <div class="p-name"><span id="profileNameDisplay">@takatubeofficialbd</span> <i class="fa-solid fa-pen" onclick="editName()"></i></div>
  <div class="p-bio" id="profileBioDisplay">Gmail: - | Mobile: -</div>
  <div class="p-stats"><div><b>42</b>Following</div><div><b id="fCount">0</b>Followers</div><div><b id="lCount">0</b>Likes</div></div>

  <div class="edit-box" id="editBox" style="display:none">
   <input id="editNameInput" placeholder="নতুন নাম লিখুন" />
   <button class="auth-btn" onclick="saveName()">Save Name</button>
  </div>
  <button onclick="logout()" style="margin-top:12px;background:#222;color:#fff;border:none;padding:8px 16px;border-radius:20px;font-size:12px">Logout</button>
 </div>
 <div class="p-grid" id="pGrid"></div>
 <div style="height:100px"></div>
 <div style="position:fixed;bottom:20px;left:0;right:0;text-align:center"><button onclick="closeProfile()" style="padding:10px 22px;border-radius:20px;border:none;font-weight:700;background:#fff;color:#000">Back to Feed</button></div>
</div>

<!-- CAMERA + GALLERY MODAL -->
<div id="cameraModal">
 <div class="cam-top">
  <video id="camPreview" autoplay playsinline muted></video>
  <div style="position:absolute;top:15px;left:15px;z-index:2" onclick="closeCamera()"><i class="fa-solid fa-xmark" style="font-size:22px"></i></div>
  <div style="position:absolute;bottom:15px;left:0;right:0;display:flex;justify-content:center;gap:20px">
   <span style="font-size:12px;background:rgba(0,0,0,.5);padding:4px 10px;border-radius:12px">Beauty</span>
   <span style="font-size:12px;background:rgba(0,0,0,.5);padding:4px 10px;border-radius:12px">Filters</span>
  </div>
 </div>
 <div class="cam-bottom">
  <div class="cam-actions">
   <i class="fa-solid fa-photo-film" style="font-size:24px;color:#aaa" onclick="document.getElementById('galleryInput').click()"></i>
   <div class="rec-btn"><div></div></div>
   <i class="fa-solid fa-camera-rotate" style="font-size:22px;color:#aaa"></i>
  </div>
  <div class="gallery-input" onclick="document.getElementById('galleryInput').click()">
   গ্যালারি থেকে ভিডিও নিন <i class="fa-solid fa-arrow-up-from-bracket"></i>
   <input type="file" id="galleryInput" accept="video/*" style="display:none" onchange="uploadFromGallery(event)">
  </div>
  <p style="text-align:center;font-size:10px;color:#666;margin-top:8px">+ এ চাপ দিলে ক্যামেরা, নিচে গ্যালারি - 100% TikTok</p>
 </div>
</div>

<script>
let currentUser = JSON.parse(localStorage.getItem('tt_user')||'null');
let videos = JSON.parse(localStorage.getItem('tt_v12')||'null') || [
 {url:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4',views:0,likes:0},
];

function switchAuth(t){
 document.getElementById('registerForm').style.display = t==='register'?'block':'none';
 document.getElementById('loginForm').style.display = t==='login'?'block':'none';
}
function doRegister(){
 const name=document.getElementById('regName').value.trim();
 const gmail=document.getElementById('regGmail').value.trim();
 const mobile=document.getElementById('regMobile').value.trim();
 const pass=document.getElementById('regPass').value.trim();
 if(!name||!gmail||!mobile||!pass){alert('সব ঘর পূরণ করো ভাই!');return}
 if(!gmail.includes('@')){alert('Gmail ঠিক দাও ভাই');return}
 currentUser={name,gmail,mobile,pass,avatar:'https://i.pravatar.cc/200?img=32',id:Date.now()};
 localStorage.setItem('tt_user',JSON.stringify(currentUser));
 let users=JSON.parse(localStorage.getItem('tt_users')||'[]');
 users.push(currentUser); localStorage.setItem('tt_users',JSON.stringify(users));
 startApp();
}
function doLogin(){
 const gmail=document.getElementById('logGmail').value.trim();
 const pass=document.getElementById('logPass').value.trim();
 let users=JSON.parse(localStorage.getItem('tt_users')||'[]');
 let u=users.find(x=>(x.gmail===gmail||x.mobile===gmail)&&x.pass===pass);
 if(!u){alert('Gmail / Password ভুল!');return}
 currentUser=u; localStorage.setItem('tt_user',JSON.stringify(u)); startApp();
}
function startApp(){
 if(!currentUser){return}
 document.getElementById('authPage').style.display='none';
 document.getElementById('app').style.display='block';
 document.getElementById('profileNameDisplay').innerText='@'+currentUser.name;
 document.getElementById('profileBioDisplay').innerText=`Gmail: ${currentUser.gmail} | Mobile: ${currentUser.mobile}`;
 document.getElementById('profileAvatar').src=currentUser.avatar;
 render();
}
function logout(){localStorage.removeItem('tt_user');location.reload()}
function render(){
 const feed=document.getElementById('feed'); feed.innerHTML='';
 videos.forEach((v,i)=>{
  const d=document.createElement('div'); d.className='post';
  d.innerHTML=`<video src="${v.url}" loop playsinline onclick="this.paused?this.play():this.pause()"></video>
  <div class="right">
   <div><div class="r-icon"><img src="${currentUser.avatar}" style="width:100%;height:100%;border-radius:50%"></div></div>
   <div><div class="r-icon"><i class="fa-solid fa-heart"></i></div><div class="r-count">${v.likes||0}</div></div>
   <div><div class="r-icon"><i class="fa-solid fa-comment-dots"></i></div><div class="r-count">0</div></div>
   <div><div class="r-icon"><i class="fa-solid fa-bookmark"></i></div><div class="r-count">0</div></div>
   <div><div class="r-icon"><i class="fa-solid fa-share"></i></div><div class="r-count">0</div></div>
  </div>
  <div class="bottom-info"><b>@${currentUser.name}</b><div style="font-size:13px;margin-top:4px">আমার ভিডিও ❤️ #fyp</div></div>`;
  feed.appendChild(d);
 });
 const grid=document.getElementById('pGrid'); grid.innerHTML='';
 videos.forEach(v=>{
  const g=document.createElement('div'); g.className='p-item';
  g.innerHTML=`<video src="${v.url}" muted></video><div class="p-view"><i class="fa-solid fa-play"></i> ${v.views||0}</div>`;
  grid.appendChild(g);
 });
 document.getElementById('fCount').innerText=videos.length;
 document.getElementById('lCount').innerText=videos.reduce((a,b)=>a+(b.likes||0),0);
 const io=new IntersectionObserver(es=>{
  es.forEach(e=>{
   if(e.isIntersecting){
    e.target.play().catch(()=>{});
    setTimeout(()=>{ // REAL VIEW COUNT
     let idx=[...document.querySelectorAll('.post video')].indexOf(e.target);
     if(idx>=0 &&!videos[idx]._viewed){ videos[idx].views=(videos[idx].views||0)+1; videos[idx]._viewed=true; localStorage.setItem('tt_v12',JSON.stringify(videos)); render(); }
    },2000);
   }else{e.target.pause()}
  })
 },{threshold:.7});
 document.querySelectorAll('.post video').forEach(v=>io.observe(v));
}
function openProfile(){document.getElementById('profile').style.display='block'}
function closeProfile(){document.getElementById('profile').style.display='none'}
function editName(){document.getElementById('editBox').style.display='block';document.getElementById('editNameInput').value=currentUser.name}
function saveName(){
 const n=document.getElementById('editNameInput').value.trim(); if(!n)return;
 currentUser.name=n; localStorage.setItem('tt_user',JSON.stringify(currentUser));
 let users=JSON.parse(localStorage.getItem('tt_users')||'[]'); let idx=users.findIndex(u=>u.id===currentUser.id); if(idx>=0){users[idx].name=n; localStorage.setItem('tt_users',JSON.stringify(users));}
 document.getElementById('profileNameDisplay').innerText='@'+n; document.getElementById('editBox').style.display='none'; render();
}
function changeAvatar(e){
 const file=e.target.files[0]; if(!file)return;
 const url=URL.createObjectURL(file); currentUser.avatar=url;
 localStorage.setItem('tt_user',JSON.stringify(currentUser));
 document.getElementById('profileAvatar').src=url; render();
}
async function openCamera(){
 document.getElementById('cameraModal').style.display='flex';
 try{ const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true}); document.getElementById('camPreview').srcObject=s; }catch(e){console.log(e)}
}
function closeCamera(){
 document.getElementById('cameraModal').style.display='none';
 let v=document.getElementById('camPreview'); if(v.srcObject){v.srcObject.getTracks().forEach(t=>t.stop())}
}
function uploadFromGallery(e){
 const file=e.target.files[0]; if(!file)return;
 const url=URL.createObjectURL(file);
 videos.unshift({url,views:0,likes:0,_viewed:false});
 localStorage.setItem('tt_v12',JSON.stringify(videos));
 closeCamera(); render(); openProfile();
}
if(currentUser) startApp();
</script>
</body>
</html>
